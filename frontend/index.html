<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <title>Jogo Mario</title>
</head>
<body>
    <div class="start-screen">
        <h1>Jogo Mario</h1>
        <button id="start-button">Iniciar Jogo</button>
    </div>
    <img src="./images/clouds.png" class="clouds" alt="Nuvens">
    <img src="./images/mario.gif" class="mario" alt="Mario">
    <img src="./images/pipe.png" class="pipe" alt="Tubo">
</div>
<div class="game-over-screen" id="game-over-screen">
    <h1>GAME OVER</h1>
    <button id="restart-button">Reiniciar Jogo</button>
</div>
</body>
</html>
